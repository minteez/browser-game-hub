    <script>
        // Web Audio API Synthesizer & Sound System
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.volume = 0.7;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playCatch(type = 'metal') {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                if (type === 'gold') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                } else if (type === 'powerup') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.2);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.1);
                }

                gain.gain.setValueAtTime(0.2 * this.volume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            playBomb() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'square';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);

                gain.gain.setValueAtTime(0.3 * this.volume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }

            playSpecialRound() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                [0, 0.15, 0.3].forEach((delay, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300 + i * 150, now + delay);
                    gain.gain.setValueAtTime(0.15 * this.volume, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.1);
                });
            }
        }

        const ITEM_TYPES = {
            STANDARD_METAL: { name: 'Iron Bolt', points: 10, weight: 1, color: '#94a3b8', type: 'metal', radius: 14, icon: 'bolt' },
            HEAVY_GEAR: { name: 'Heavy Gear', points: 25, weight: 2.5, color: '#64748b', type: 'metal', radius: 20, icon: 'gear' },
            GOLDEN_INGOT: { name: 'Gold Scrap', points: 100, weight: 1.2, color: '#fbbf24', type: 'gold', radius: 16, icon: 'gem' },
            BATTERY: { name: 'Power Cell', points: 50, weight: 1, color: '#06b6d4', type: 'powerup', radius: 15, icon: 'battery' },
            FAKE_SHARD: { name: 'Fool’s Shard', points: -50, weight: 1, color: '#a855f7', type: 'fake', radius: 15, icon: 'skull' },
            BOMB: { name: 'Unstable Mine', points: 0, weight: 1.5, color: '#ef4444', type: 'bomb', radius: 18, icon: 'bomb' }
        };

        class MagnetCatchGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.sound = new SoundFX();

                this.state = 'MENU'; // MENU, PLAYING, PAUSED, GAMEOVER, SUBMENU
                this.gameMode = 'classic'; // classic, timeAttack, endless

                // Player State
                this.player = {
                    x: 0,
                    y: 0,
                    width: 120,
                    height: 35,
                    vx: 0,
                    speed: 12,
                    magnetStrength: 1.0,
                    magnetRadius: 180,
                    targetX: 0
                };

                // Game Loop Variables
                this.score = 0;
                this.combo = 1;
                this.comboTimer = 0;
                this.lives = 3;
                this.scrapCurrency = 0;
                this.timeLeft = 60;
                this.gameTimer = null;
                this.spawnTimer = 0;
                this.specialRoundTimer = 0;
                this.isSpecialRound = false;
                this.playTimeCounter = 0;

                // Powerups
                this.powerupActive = null;
                this.powerupTimer = 0;

                // Arrays
                this.items = [];
                this.particles = [];
                this.floatingTexts = [];

                // Persistence Data Stores
                this.highScores = {
                    classic: 0,
                    timeAttack: 0,
                    endless: 0
                };
                this.bestCombos = {
                    classic: 1,
                    timeAttack: 1,
                    endless: 1
                };
                this.statistics = {
                    gamesPlayed: 0,
                    highestScore: 0,
                    totalPlaytimeSeconds: 0,
                    bestCombo: 1,
                    itemsCollected: 0,
                    enemiesDefeated: 0
                };
                this.settings = {
                    soundEnabled: true,
                    soundVolume: 0.7,
                    particlesEnabled: true,
                    screenShake: true,
                    gameSpeed: 1.0
                };
                this.accessibility = {
                    highContrast: false,
                    colorBlindFriendly: false,
                    reducedMotion: false,
                    largeText: false
                };

                // Upgrades
                this.upgrades = {
                    radius: { level: 1, cost: 100, max: 5 },
                    speed: { level: 1, cost: 150, max: 5 },
                    magnetism: { level: 1, cost: 200, max: 5 }
                };

                // Achievements
                this.achievements = [
                    { id: 'first_catch', name: 'Junkyard Rookie', desc: 'Catch your first piece of scrap', unlocked: false },
                    { id: 'combo_5', name: 'Chain Reaction', desc: 'Reach a 5x combo multiplier', unlocked: false },
                    { id: 'rich', name: 'Scrap Baron', desc: 'Accumulate 500 scrap currency', unlocked: false },
                    { id: 'golden', name: 'Midas Touch', desc: 'Collect 10 golden ingots', unlocked: false }
                ];
                this.goldCollectedCount = 0;

                this.loadSaveData();
                this.initResize();
                this.initInputs();
            }

            loadSaveData() {
                const saved = localStorage.getItem('magnet_catch_comprehensive_save');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        this.scrapCurrency = data.scrapCurrency || 0;
                        if (data.highScores) this.highScores = data.highScores;
                        if (data.bestCombos) this.bestCombos = data.bestCombos;
                        if (data.statistics) this.statistics = data.statistics;
                        if (data.settings) {
                            this.settings = data.settings;
                            this.sound.enabled = this.settings.soundEnabled;
                            this.sound.volume = this.settings.soundVolume;
                        }
                        if (data.accessibility) this.accessibility = data.accessibility;
                        if (data.upgrades) this.upgrades = data.upgrades;
                        if (data.achievements) {
                            data.achievements.forEach(savedAch => {
                                const found = this.achievements.find(a => a.id === savedAch.id);
                                if (found) found.unlocked = savedAch.unlocked;
                            });
                        }
                    } catch (e) {
                        console.error('Failed to load comprehensive save data', e);
                    }
                }

            saveData() {
                const data = {
                    scrapCurrency: this.scrapCurrency,
                    highScores: this.highScores,
                    bestCombos: this.bestCombos,
                    statistics: this.statistics,
                    settings: this.settings,
                    accessibility: this.accessibility,
                    upgrades: this.upgrades,
                    achievements: this.achievements.map(a => ({ id: a.id, unlocked: a.unlocked }))
                };
                localStorage.setItem('magnet_catch_comprehensive_save', JSON.stringify(data));
            }

            resetSaveData() {
                if (confirm('Are you sure you want to reset all game data, high scores, and upgrades?')) {
                    localStorage.removeItem('magnet_catch_comprehensive_save');
                    location.reload();
                }

            initResize() {
                const resize = () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                    this.player.y = this.canvas.height - 70;
                    if (this.state === 'MENU') {
                        this.player.x = this.canvas.width / 2 - this.player.width / 2;
                        this.player.targetX = this.player.x;
                    }
                };
                window.addEventListener('resize', resize);
                resize();
            }

            initInputs() {
                this.keys = {};
                window.addEventListener('keydown', e => {
                    this.keys[e.key] = true;
                    if (e.key === 'p' || e.key === 'P') {
                        if (this.state === 'PLAYING' || this.state === 'PAUSED') this.togglePause();
                    }
                });
                window.addEventListener('keyup', e => {
                    this.keys[e.key] = false;
                });

                const updateTargetX = (clientX) => {
                    if (this.state === 'PLAYING') {
                        this.player.targetX = clientX - this.player.width / 2;
                    }
                };

                window.addEventListener('mousemove', e => updateTargetX(e.clientX));
                window.addEventListener('touchmove', e => {
                    if (e.touches.length > 0) {
                        updateTargetX(e.touches[0].clientX);
                    }
                }, { passive: true });
                window.addEventListener('touchstart', e => {
                    if (e.touches.length > 0) {
                        updateTargetX(e.touches[0].clientX);
                    }
                }, { passive: true });
            }

            closeSubMenu() {
                document.getElementById('screen-submenu').classList.add('hidden');
                if (this.state === 'PAUSED') {
                    document.getElementById('screen-pause').classList.remove('hidden');
                }
            }

            openSubMenuFromPause(menuType) {
                document.getElementById('screen-pause').classList.add('hidden');
                this.openSubMenu(menuType);
            }

            updateSetting(key, val) {
                this.settings[key] = val;
                if (key === 'soundEnabled') this.sound.enabled = val;
                if (key === 'soundVolume') this.sound.volume = val;
                this.saveData();
            }

            updateAccessibility(key, val) {
                this.accessibility[key] = val;
                this.saveData();
            }

            buyUpgrade(key) {
                const upgrade = this.upgrades[key];
                const cost = upgrade.cost * upgrade.level;
                if (this.scrapCurrency >= cost && upgrade.level < upgrade.max) {
                    this.scrapCurrency -= cost;
                    upgrade.level++;
                    this.saveData();
                    this.openSubMenu('shop');
                }
            }

            startMode(mode) {
                this.gameMode = mode;
                this.score = 0;
                this.combo = 1;
                this.comboTimer = 0;
                this.lives = mode === 'endless' ? 999 : 3;
                this.items = [];
                this.particles = [];
                this.floatingTexts = [];
                this.powerupActive = null;
                this.powerupTimer = 0;
                this.isSpecialRound = false;
                this.specialRoundTimer = 0;
                this.playTimeCounter = 0;

                // Apply upgrade stats
                this.player.magnetRadius = 180 + (this.upgrades.radius.level - 1) * 30;
                this.player.speed = (12 + (this.upgrades.speed.level - 1) * 2) * this.settings.gameSpeed;
                this.player.magnetStrength = 1.0 + (this.upgrades.magnetism.level - 1) * 0.4;

                document.getElementById('screen-menu').classList.add('hidden');
                document.getElementById('hud').classList.remove('opacity-0');
                
                const timerContainer = document.getElementById('hud-timer-container');
                const livesContainer = document.getElementById('hud-lives');

                if (this.gameTimer) clearInterval(this.gameTimer);
                if (mode === 'timeAttack') {
                    timerContainer.classList.remove('hidden');
                    livesContainer.classList.add('hidden');
                    this.timeLeft = 60;
                    this.gameTimer = setInterval(() => {
                        this.timeLeft--;
                        document.getElementById('hud-timer').innerText = this.timeLeft + 's';
                        if (this.timeLeft <= 0) {
                            clearInterval(this.gameTimer);
                            this.gameOver();
                        }
                    }, 1000);
                } else if (mode === 'endless') {
                    timerContainer.classList.add('hidden');
                    livesContainer.classList.add('hidden');
                } else {
                    timerContainer.classList.add('hidden');
                    livesContainer.classList.remove('hidden');
                }

                // Playtime statistics ticker
                this.playtimeTimerInterval = setInterval(() => {
                    if (this.state === 'PLAYING') {
                        this.statistics.totalPlaytimeSeconds++;
                    }
                }, 1000);

                this.state = 'PLAYING';
                this.sound.init();
            }

            togglePause() {
                if (this.state === 'PLAYING') {
                    this.state = 'PAUSED';
                    document.getElementById('screen-pause').classList.remove('hidden');
                } else if (this.state === 'PAUSED') {
                    this.state = 'PAUSED';
                    // handled by submenu back button
                }
            }

            returnToMenu() {
                if (this.gameTimer) clearInterval(this.gameTimer);
                if (this.playtimeTimerInterval) clearInterval(this.playtimeTimerInterval);
                this.state = 'MENU';
                document.getElementById('screen-pause').classList.add('hidden');
                document.getElementById('screen-gameover').classList.add('hidden');
                document.getElementById('screen-submenu').classList.add('hidden');
                document.getElementById('hud').classList.add('opacity-0');
                document.getElementById('screen-menu').classList.remove('hidden');
            }

            gameOver() {
                if (this.gameTimer) clearInterval(this.gameTimer);
                if (this.playtimeTimerInterval) clearInterval(this.playtimeTimerInterval);
                this.state = 'GAMEOVER';

                // Update statistics
                this.statistics.gamesPlayed++;
                if (this.score > this.statistics.highestScore) {
                    this.statistics.highestScore = this.score;
                }
                if (this.combo > this.statistics.bestCombo) {
                    this.statistics.bestCombo = this.combo;
                }

                // Check High Score
                let isNewRecord = false;
                if (this.score > this.highScores[this.gameMode]) {
                    this.highScores[this.gameMode] = this.score;
                    isNewRecord = true;
                }
                if (this.combo > this.bestCombos[this.gameMode]) {
                    this.bestCombos[this.gameMode] = this.combo;
                }

                const earnedScrap = Math.floor(this.score / 10);
                this.scrapCurrency += earnedScrap;
                this.checkAchievement('rich');
                this.saveData();

                document.getElementById('go-score').innerText = this.score;
                document.getElementById('go-combo').innerText = this.combo + 'x';
                const recordEl = document.getElementById('go-newrecord');
                if (isNewRecord) recordEl.classList.remove('hidden');
                else recordEl.classList.add('hidden');

                document.getElementById('screen-gameover').classList.remove('hidden');
            }

            restartGame() {
                document.getElementById('screen-gameover').classList.add('hidden');
                document.getElementById('screen-pause').classList.add('hidden');
                this.startMode(this.gameMode);
            }

            checkAchievement(id) {
                const ach = this.achievements.find(a => a.id === id);
                if (ach && !ach.unlocked) {
                    ach.unlocked = true;
                    this.showToast(`Achievement Unlocked: ${ach.name}!`);
                    this.saveData();
                }
            }

            showToast(message) {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'bg-slate-900 border border-cyan-500/50 text-cyan-300 px-4 py-3 rounded-xl shadow-2xl font-arcade text-xs flex items-center space-x-2 animate-bounce';
                toast.innerHTML = `<i class="fa-solid fa-bell"></i><span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            spawnItem() {
                const rand = Math.random();
                let def = ITEM_TYPES.STANDARD_METAL;

                if (this.isSpecialRound) {
                    if (rand < 0.5) def = ITEM_TYPES.GOLDEN_INGOT;
                    else if (rand < 0.8) def = ITEM_TYPES.HEAVY_GEAR;
                    else def = ITEM_TYPES.BATTERY;
                } else {
                    if (rand < 0.1) def = ITEM_TYPES.GOLDEN_INGOT;
                    else if (rand < 0.25) def = ITEM_TYPES.HEAVY_GEAR;
                    else if (rand < 0.35) def = ITEM_TYPES.BATTERY;
                    else if (rand < 0.45) def = ITEM_TYPES.FAKE_SHARD;
                    else if (rand < 0.55) def = ITEM_TYPES.BOMB;
                }

                const item = {
                    x: Math.random() * (this.canvas.width - 60) + 30,
                    y: -40,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() * 2 + 2 + (this.score / 500)) * this.settings.gameSpeed,
                    ...def,
                    currentRadius: def.radius
                };
                this.items.push(item);
            }

            update(dt) {
                if (this.state !== 'PLAYING') return;

                if (this.keys['ArrowLeft'] || this.keys['a'] || this.keys['A']) {
                    this.player.targetX -= this.player.speed * 1.5;
                }
                if (this.keys['ArrowRight'] || this.keys['d'] || this.keys['D']) {
                    this.player.targetX += this.player.speed * 1.5;
                }

                this.player.targetX = Math.max(0, Math.min(this.canvas.width - this.player.width, this.player.targetX));
                this.player.x += (this.player.targetX - this.player.x) * 0.2;

                if (this.comboTimer > 0) {
                    this.comboTimer -= dt;
                    if (this.comboTimer <= 0) this.combo = 1;
                }

                if (this.powerupActive) {
                    this.powerupTimer -= dt;
                    if (this.powerupTimer <= 0) {
                        this.powerupActive = null;
                        document.getElementById('hud-powerup').classList.add('hidden');
                    }
                }

                if (this.isSpecialRound) {
                    this.specialRoundTimer -= dt;
                    if (this.specialRoundTimer <= 0) {
                        this.isSpecialRound = false;
                        document.getElementById('hud-powerup').classList.add('hidden');
                    }
                } else {
                    if (Math.random() < 0.0005) {
                        this.isSpecialRound = true;
                        this.specialRoundTimer = 15;
                        document.getElementById('hud-powerup-text').innerText = 'GOLD RUSH!';
                        document.getElementById('hud-powerup').classList.remove('hidden');
                        this.sound.playSpecialRound();
                        this.showToast('Special Round: Gold Rush Active!');
                    }
                }

                this.spawnTimer += dt;
                const spawnInterval = Math.max(0.4, 1.2 - (this.score / 1000));
                if (this.spawnTimer >= spawnInterval) {
                    this.spawnTimer = 0;
                    this.spawnItem();
                    if (this.score > 300 && Math.random() < 0.4) this.spawnItem();
                }

                const magnetCenterX = this.player.x + this.player.width / 2;
                const magnetCenterY = this.player.y;
                const effectiveRadius = this.powerupActive === 'mega' ? this.player.magnetRadius * 1.8 : this.player.magnetRadius;

                for (let i = this.items.length - 1; i >= 0; i--) {
                    const item = this.items[i];
                    item.y += item.vy;
                    item.x += item.vx;

                    const dx = magnetCenterX - item.x;
                    const dy = magnetCenterY - item.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (item.type !== 'bomb' && dist < effectiveRadius && item.y < magnetCenterY) {
                        const pullForce = (1 - dist / effectiveRadius) * (this.player.magnetStrength * 2.5) / item.weight;
                        item.vx += (dx / dist) * pullForce;
                        item.vy += (dy / dist) * pullForce;
                    }

                    if (
                        item.x > this.player.x &&
                        item.x < this.player.x + this.player.width &&
                        item.y + item.radius >= this.player.y &&
                        item.y - item.radius <= this.player.y + this.player.height
                    ) {
                        this.handleCollection(item);
                        this.items.splice(i, 1);
                        continue;
                    }

                    if (item.y > this.canvas.height + 50) {
                        if (item.type === 'metal' || item.type === 'gold') this.combo = 1;
                        this.items.splice(i, 1);
                    }
                }

                if (this.settings.particlesEnabled && !this.accessibility.reducedMotion) {
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.02;
                        if (p.alpha <= 0) this.particles.splice(i, 1);
                    }
                }

                for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                    const ft = this.floatingTexts[i];
                    ft.y -= 1.5;
                    ft.alpha -= 0.02;
                    if (ft.alpha <= 0) this.floatingTexts.splice(i, 1);
                }

                document.getElementById('hud-score').innerText = this.score;
                document.getElementById('hud-combo').innerText = this.combo + 'x';
            }

            handleCollection(item) {
                this.checkAchievement('first_catch');
                this.statistics.itemsCollected++;

                if (item.type === 'gold') {
                    this.goldCollectedCount++;
                    if (this.goldCollectedCount >= 10) this.checkAchievement('golden');
                }

                if (item.type === 'bomb') {
                    this.sound.playBomb();
                    this.statistics.enemiesDefeated++;
                    this.combo = 1;
                    this.createExplosion(item.x, item.y, '#ef4444');
                    if (this.gameMode === 'classic') {
                        this.lives--;
                        this.updateLivesUI();
                        if (this.lives <= 0) this.gameOver();
                    }
                    this.showFloatingText('-0 Pts', item.x, item.y, '#ef4444');
                    return;
                }

                if (item.type === 'fake') {
                    this.sound.playBomb();
                    this.statistics.enemiesDefeated++;
                    this.combo = 1;
                    this.score = Math.max(0, this.score + item.points);
                    this.showFloatingText(`${item.points} Pts`, item.x, item.y, '#a855f7');
                    return;
                }

                if (item.type === 'powerup') {
                    this.powerupActive = 'mega';
                    this.powerupTimer = 8;
                    document.getElementById('hud-powerup-text').innerText = 'MEGA MAG';
                    document.getElementById('hud-powerup').classList.remove('hidden');
                    this.sound.playCatch('powerup');
                    this.showFloatingText('MEGA MAGNET!', item.x, item.y, '#06b6d4');
                    return;
                }

                this.sound.playCatch(item.type);
                const pointsEarned = item.points * this.combo;
                this.score += pointsEarned;

                this.combo = Math.min(10, this.combo + 1);
                if (this.combo >= 5) this.checkAchievement('combo_5');
                if (this.combo > this.statistics.bestCombo) this.statistics.bestCombo = this.combo;
                this.comboTimer = 4;

                this.createExplosion(item.x, item.y, item.color);
                this.showFloatingText(`+${pointsEarned}`, item.x, item.y, item.color);
            }

            updateLivesUI() {
                const livesContainer = document.getElementById('hud-lives');
                let html = '';
                for (let i = 0 ; i < this.lives; i++) html += '<i class="fa-solid fa-heart"></i>';
                livesContainer.innerHTML = html;
            }

            createExplosion(x, y, color) {
                if (!this.settings.particlesEnabled || this.accessibility.reducedMotion) return;
                for (let i = 0; i < 12; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4 + 2;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color,
                        alpha: 1,
                        size: Math.random() * 4 + 2
                    });
                }
            }

            showFloatingText(text, x, y, color) {
                this.floatingTexts.push({ text, x, y, color, alpha: 1 });
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.strokeStyle = this.accessibility.highContrast ? 'rgba(100, 116, 139, 0.8)' : 'rgba(30, 41, 59, 0.4)';
                this.ctx.lineWidth = 1;
                const gridSize = 40;
                for (let x = 0; x < this.canvas.width; x += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }

                if (this.state !== 'PLAYING' && this.state !== 'PAUSED') return;

                const magnetCenterX = this.player.x + this.player.width / 2;
                const magnetCenterY = this.player.y;
                const effectiveRadius = this.powerupActive === 'mega' ? this.player.magnetRadius * 1.8 : this.player.magnetRadius;

                const gradient = this.ctx.createRadialGradient(magnetCenterX, magnetCenterY, 10, magnetCenterX, magnetCenterY, effectiveRadius);
                gradient.addColorStop(0, 'rgba(6, 182, 212, 0.15)');
                gradient.addColorStop(1, 'rgba(6, 182, 212, 0)');
                this.ctx.fillStyle = gradient;
                this.ctx.beginPath();
                this.ctx.arc(magnetCenterX, magnetCenterY, effectiveRadius, 0, Math.PI * 2);
                this.ctx.fill();

                this.items.forEach(item => {
                    this.ctx.save();
                    this.ctx.translate(item.x, item.y);
                    this.ctx.fillStyle = item.color;
                    this.ctx.beginPath();
                    if (item.type === 'bomb') {
                        this.ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
                        this.ctx.fill();
                        this.ctx.fillStyle = '#f59e0b';
                        this.ctx.fillRect(-3, -item.radius - 6, 6, 6);
                    } else if (item.type === 'gold') {
                        this.ctx.rect(-item.radius, -item.radius * 0.7, item.radius * 2, item.radius * 1.4);
                        this.ctx.fill();
                    } else {
                        this.ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                    if (this.accessibility.colorBlindFriendly) {
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.font = 'bold 10px sans-serif';
                        this.ctx.fillText(item.icon === 'bomb' ? 'X' : '', -4, 4);
                    }
                    this.ctx.restore();
                });

                this.ctx.save();
                this.ctx.translate(this.player.x, this.player.y);
                this.ctx.fillStyle = '#334155';
                this.ctx.roundRect(0, 0, this.player.width, this.player.height, 8);
                this.ctx.fill();
                this.ctx.strokeStyle = '#06b6d4';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();

                this.ctx.fillStyle = this.powerupActive ? '#06b6d4' : '#38bdf8';
                this.ctx.beginPath();
                this.ctx.arc(this.player.width / 2, this.player.height / 2, 12, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();

                this.particles.forEach(p => {
                    this.ctx.save();
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });

                this.floatingTexts.forEach(ft => {
                    this.ctx.save();
                    this.ctx.globalAlpha = ft.alpha;
                    this.ctx.fillStyle = ft.color;
                    this.ctx.font = 'bold 16px Orbitron, sans-serif';
                    this.ctx.fillText(ft.text, ft.x, ft.y);
                    this.ctx.restore();
                });
            }

            loop(timestamp) {
                if (!this.lastTime) this.lastTime = timestamp;
                const dt = (timestamp - this.lastTime) / 1000;
                this.lastTime = timestamp;

                this.update(dt);
                this.draw();

                requestAnimationFrame((ts) => this.loop(ts));
            }
        }

        const game = new MagnetCatchGame();
        window.onload = () => {
            requestAnimationFrame((timestamp) => game.loop(timestamp));
        };
    </script>

</body>
